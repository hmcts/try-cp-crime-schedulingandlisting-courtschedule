java:
  # Real Entra tokens in this environment. The same three values the live API's APIM validate-jwt
  # policy pins, taken from api-cp-crime-schedulingandlisting-courtschedule's
  # infrastructure/preview.tfvars - identifiers,
  # not secrets, which is why they are committed here exactly as they are there. This service needs
  # no client secret at all: it verifies tokens, it never requests one.
  #
  # AUTH_AUDIENCE is the hmcts-api-marketplace registration, NOT a try-slc-specific one. A token
  # minted for that API is therefore accepted here - the same posture api-cp's APIM policy takes,
  # so this is consistent with the estate rather than a relaxation of it. Note that this differs
  # from the EntraAuthProperties javadoc's "this API's own application id".
  #
  # AUTH_ISSUER must be the login.microsoftonline.com form. The same directory also answers on
  # <tid>.ciamlogin.com with a DIFFERENT iss claim, which the validator matches exactly and would
  # reject - see the debugging table in CLAUDE.md.
  #
  # Setting ENTRA removes the demo token endpoint, the demo JWKS and the published demo credentials
  # from this environment. Callers need their own app registration carrying the app.read app role,
  # which is what web-api-marketplace grants on every application it registers.
  environment:
    AUTH_KEY_SOURCE: "ENTRA"
    AUTH_TENANT_ID: "d44f885c-4fac-47bf-afde-d7d861ec4d7b"
    AUTH_AUDIENCE: "30288840-e345-4543-99ee-f9253d789339"
    AUTH_ISSUER: "https://login.microsoftonline.com/d44f885c-4fac-47bf-afde-d7d861ec4d7b/v2.0"
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  keyVaults:
    amp-try-slc:
      secrets:
        - name: try-slc-DEMO-SIGNING-KEY-JWK
          alias: DEMO_SIGNING_KEY_JWK
        - name: try-slc-POSTGRES-USER
          alias: POSTGRES_USER
        - name: try-slc-POSTGRES-PASS
          alias: POSTGRES_PASS
        - name: try-slc-POSTGRES-HOST
          alias: POSTGRES_HOST
        - name: try-slc-POSTGRES-PORT
          alias: POSTGRES_PORT
        - name: try-slc-POSTGRES-DATABASE
          alias: POSTGRES_DATABASE
