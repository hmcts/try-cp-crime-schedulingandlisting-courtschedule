server:
  port: 8080
  shutdown: "graceful"

management:
  endpoint:
    health:
      show-details: "always"
      probes:
        enabled: true
  endpoints:
    web:
      # Kept at "/" to match the chart-java probe paths (/health, /info). Note this makes the
      # actuator endpoints sit at the context root, which AuthorizationPolicy handles by listing
      # them in PUBLIC_EXACT_PATHS - see the comment there before changing this value.
      base-path: /
      exposure:
        include: health, info, prometheus

spring:
  config:
    import: "optional:configtree:/mnt/secrets/amp-try-slc/,optional:configtree:/mnt/secrets/amp-try-slc-sbox/"
  application:
    name: try-cp-crime-schedulingandlisting-courtschedule
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:tryitnow}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASS:postgres}
    hikari:
      maximumPoolSize: 4
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate must never alter it, or a mapping change would silently
      # rewrite a table holding approved examples.
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

azure:
  application-insights:
    instrumentation-key: ${rpe.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}

# Validation is the SAME EntraTokenValidator the real service uses, in both key sources. Only the
# keys and the issuer identifiers differ - see uk.gov.hmcts.cp.config.TokenKeySource.
#
#   SELF_ISSUED  this service mints the tokens it verifies, against an in-memory key. No egress, no
#                app registration. Local development, and any environment without one yet.
#   ENTRA        real Entra app-only tokens, verified against the tenant's JWKS over HTTPS. The
#                demo token endpoint, the demo JWKS and the signing key are removed from the
#                context, so the service cannot mint a token it would have to reject.
#
# ENTRA is the default so an unconfigured environment fails closed at startup rather than quietly
# accepting tokens this service minted itself. It needs THREE variables set - AUTH_TENANT_ID,
# AUTH_AUDIENCE and AUTH_ISSUER. AuthKeySourceProperties refuses to start without them.
auth:
  key-source: ${AUTH_KEY_SOURCE:ENTRA}
  mode: ENFORCE
  # Defaulted to the self-issued identifiers below, so local development needs no configuration.
  # In ENTRA mode those defaults are rejected at startup; AUTH_AUDIENCE must be this API's bare
  # application id GUID, not an api:// URI, because the validator pins ver=2.0.
  tenant-id: ${AUTH_TENANT_ID:${demo.self-issued.tenant-id}}
  audience: ${AUTH_AUDIENCE:${demo.self-issued.audience}}
  issuer: ${AUTH_ISSUER:${demo.self-issued.issuer}}
  # Derived from tenant-id when blank: https://login.microsoftonline.com/<tid>/discovery/v2.0/keys
  jwks-uri: ${AUTH_JWKS_URI:}
  clock-skew-seconds: 60

demo:
  # This service's own invented issuer identity, used only by SELF_ISSUED. Declared once here rather
  # than inline above so the ENTRA startup check has something to compare against - if auth.* still
  # equals any of these, the realm was never configured.
  self-issued:
    tenant-id: 00000000-0000-0000-0000-0000000000aa
    audience: api://try-cp-crime-schedulingandlisting-courtschedule
    issuer: https://try-it-now.amp.hmcts.internal/00000000-0000-0000-0000-0000000000aa/v2.0
  # RSA private key (JWK JSON) used to sign demo tokens. Supplied from the amp-{env} key vault in
  # every deployed environment. Blank means "generate an ephemeral key at startup" - acceptable for
  # local development only; the service logs a loud warning and tokens die with the process.
  signing-key-jwk: ${DEMO_SIGNING_KEY_JWK:}
  token-ttl-seconds: 3600
  # Where the published Swagger UI lives. Try-it-out is a browser fetch from this origin, so it must
  # be allowed by CORS or every call fails in the browser while curl succeeds.
  allowed-origins: "https://hmcts.github.io"

recording:
  api-id: api-cp-crime-schedulingandlisting-courtschedule
  operation-id: getCourtScheduleByCaseUrn
  # Committed fixtures are seeded on first boot so a fresh environment is never empty. They are
  # marked recorded_from=fixture and are indistinguishable from a recording thereafter.
  seed-fixtures: ${RECORDING_SEED_FIXTURES:true}
