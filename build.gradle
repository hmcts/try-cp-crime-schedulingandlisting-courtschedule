plugins {
  id 'application'
  id 'jacoco'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.springframework.boot' version '4.1.1'
  id 'com.github.ben-manes.versions' version '0.61.0'
  id 'org.sonarqube' version '7.5.0.8588'
  /*
    Applies analysis tools including checkstyle and OWASP Dependency checker.
    See https://github.com/hmcts/gradle-java-plugin
 */
  id 'uk.gov.hmcts.java' version '0.12.70'
}

application {
  mainClass = 'uk.gov.hmcts.cp.Application'
  group = 'uk.gov.hmcts.cp'
  version = '0.0.1'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

def configureSourceSet(String name) {
  sourceSets.create(name) { sourceSet ->
    sourceSet.java {
      compileClasspath += sourceSets.main.output + sourceSets.test.output
      runtimeClasspath += sourceSets.main.output + sourceSets.test.output
      srcDir "src/${name}/java"
    }
    sourceSet.resources.srcDir "src/${name}/resources"
  }
}

['smokeTest', 'integrationTest', 'functionalTest'].each { configureSourceSet(it) }

configurations {
  functionalTestImplementation.extendsFrom testImplementation
  functionalTestRuntimeOnly.extendsFrom runtimeOnly

  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom runtimeOnly

  smokeTestImplementation.extendsFrom testImplementation
  smokeTestRuntimeOnly.extendsFrom runtimeOnly
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs << "-Xlint:unchecked" << "-Werror"
}

// https://github.com/gradle/gradle/issues/16791
tasks.withType(JavaExec).configureEach {
  javaLauncher.set(javaToolchains.launcherFor(java.toolchain))
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()
  failFast = true

  testLogging {
    exceptionFormat = 'full'
  }
}

tasks.register('functional', Test) {
  description = "Runs functional tests"
  group = "Verification"
  testClassesDirs = sourceSets.functionalTest.output.classesDirs
  classpath = sourceSets.functionalTest.runtimeClasspath
}

tasks.register('integration', Test) {
  description = "Runs integration tests"
  group = "Verification"
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
  failFast = true
}

tasks.register('smoke', Test) {
  description = "Runs Smoke Tests"
  group = "Verification"
  testClassesDirs = sourceSets.smokeTest.output.classesDirs
  classpath = sourceSets.smokeTest.runtimeClasspath
}

jacocoTestReport {
  executionData(test, integration)
  reports {
    xml.getRequired().set(true)
    csv.getRequired().set(false)
    html.getRequired().set(true)
  }
}

tasks.sonarqube.dependsOn(jacocoTestReport)
tasks.check.dependsOn(integration)

sonarqube {
  properties {
    property "sonar.projectName", "HMCTS :: Try It Now :: Court Schedule"
    property "sonar.projectKey", "uk.gov.hmcts.cp:try-cp-crime-schedulingandlisting-courtschedule"
    property "sonar.coverage.exclusions", "**/Application.java,**/exceptions/**"
  }
}

dependencyUpdates {
  def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { qualifier -> version.toUpperCase().contains(qualifier) }
    def regex = /^[0-9,.v-]+$/
    return !stableKeyword && !(version ==~ regex)
  }
  rejectVersionIf { selection ->
    return isNonStable(selection.candidate.version) && !isNonStable(selection.currentVersion)
  }
}

// The auth sources and the two filters below are lifted from
// service-cp-crime-scheduleandlist-courtschedule so this sandbox enforces exactly the token rules the
// live API enforces. Five of them (EntraTokenValidator, EntraAuthProperties, AuthMode,
// ValidatedCaller, TokenValidationException) are byte-identical to their source and must stay that
// way; the rest diverge only as documented in-file. Keeping them diffable matters more than
// reformatting them to this repo's checkstyle profile, so they are excluded rather than edited.
// Everything written for this service is checked normally.
checkstyleMain {
  exclude 'uk/gov/hmcts/cp/auth/**'
  exclude 'uk/gov/hmcts/cp/filters/ClientIdResolutionFilter.java'
  exclude 'uk/gov/hmcts/cp/filters/tracing/TracingFilter.java'
}

// https://jeremylong.github.io/DependencyCheck/dependency-check-gradle/configuration.html
dependencyCheck {
  suppressionFile = 'config/owasp/suppressions.xml'
}

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    url = uri('https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1')
  }
}

ext['snakeyaml.version'] = '2.0'
// 28/06/2026 temp fix for tomcat CVE-2026-65182 pending spring boot catchup
ext['tomcat.version'] = '11.0.25'

dependencies {
  // The API contract this sandbox implements. The generated CourtScheduleApi interface and its
  // models are the ONLY definition of the response shape - every stub in src/main/resources/stubs
  // is deserialised into these types by ScenarioCatalogContractTest, so a stub that drifts from the
  // published contract fails the build rather than silently serving a wrong body.
  implementation "uk.gov.hmcts.cp:api-cp-crime-schedulingandlisting-courtschedule:1.1.0"

  // Resolves the @Schema/@Parameter annotations on the generated api-cp-* interface/models at
  // compile time - without it -Werror fails on "unknown enum constant" for their RequiredMode/
  // ParameterIn values. Not needed at runtime (the generated classes already carry them baked in).
  compileOnly "io.swagger.core.v3:swagger-annotations-jakarta:2.2.55"
  testCompileOnly "io.swagger.core.v3:swagger-annotations-jakarta:2.2.55"

  // Mints the demo access tokens AND verifies them. Same library the real service uses, so the
  // copied EntraTokenValidator is byte-identical to service-cp-crime-scheduleandlist-courtschedule.
  implementation "com.nimbusds:nimbus-jose-jwt:10.9.1"

  // Recording store. The sandbox holds recorded examples rather than only committed fixtures -
  // see the Recording pipeline section of the README.
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-flyway'
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-database-postgresql'
  implementation 'org.postgresql:postgresql'

  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-actuator'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-aspectj'
  implementation 'org.springframework.boot:spring-boot-starter-validation'

  implementation 'com.fasterxml.jackson.core:jackson-databind'
  implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
  implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

  // micrometer-registry-prometheus: management.endpoints exposure includes "prometheus", which
  // 404s without a registry implementation on the classpath.
  implementation 'io.micrometer:micrometer-registry-prometheus'

  // Encodes caller-supplied values before they reach log lines, preventing log injection
  implementation 'org.owasp.encoder:encoder:1.4.0'

  implementation group: 'com.github.hmcts.java-logging', name: 'logging', version: '8.0.0'

  implementation 'org.apache.logging.log4j:log4j-to-slf4j'
  implementation 'ch.qos.logback:logback-classic'
  implementation 'ch.qos.logback:logback-core'

  compileOnly 'org.projectlombok:lombok:1.18.48'
  annotationProcessor 'org.projectlombok:lombok:1.18.48'
  testCompileOnly 'org.projectlombok:lombok:1.18.48'
  testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.testcontainers:postgresql:1.21.4'
  testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test'
  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-webmvc-test'
  testImplementation group: 'io.rest-assured', name: 'rest-assured', version: '6.0.1'
}

bootJar {
  archiveFileName = "apim-tryitnow-slc.jar"

  manifest {
    attributes('Implementation-Version': project.version.toString())
  }
}

// Gradle 7.x issue, workaround from: https://github.com/gradle/gradle/issues/17236#issuecomment-894768083
rootProject.tasks.named("processSmokeTestResources") {
  duplicatesStrategy = 'include'
}

wrapper {
    distributionType = Wrapper.DistributionType.ALL
}
