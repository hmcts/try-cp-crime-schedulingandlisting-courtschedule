plugins {
  id 'application'
  id 'jacoco'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.springframework.boot' version '4.1.1'
  id 'org.sonarqube' version '7.5.0.8588'
  /*
    Applies analysis tools including checkstyle and OWASP Dependency checker.
    See https://github.com/hmcts/gradle-java-plugin
 */
  id 'uk.gov.hmcts.java' version '0.12.70'
  id 'org.openapi.generator' version '7.19.0'
}

application {
  mainClass = 'uk.gov.hmcts.cp.Application'
  group = 'uk.gov.hmcts.cp'
  version = '0.0.1'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

def configureSourceSet(String name) {
  sourceSets.create(name) { sourceSet ->
    sourceSet.java {
      compileClasspath += sourceSets.main.output + sourceSets.test.output
      runtimeClasspath += sourceSets.main.output + sourceSets.test.output
      srcDir "src/${name}/java"
    }
    sourceSet.resources.srcDir "src/${name}/resources"
  }
}

['smokeTest', 'integrationTest', 'functionalTest'].each { configureSourceSet(it) }

configurations {
  functionalTestImplementation.extendsFrom testImplementation
  functionalTestRuntimeOnly.extendsFrom runtimeOnly

  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom runtimeOnly

  smokeTestImplementation.extendsFrom testImplementation
  smokeTestRuntimeOnly.extendsFrom runtimeOnly
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs << "-Xlint:unchecked" << "-Werror"
}

// https://github.com/gradle/gradle/issues/16791
tasks.withType(JavaExec).configureEach {
  javaLauncher.set(javaToolchains.launcherFor(java.toolchain))
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()
  failFast = true

  testLogging {
    exceptionFormat = 'full'
  }
}

tasks.register('functional', Test) {
  description = "Runs functional tests"
  group = "Verification"
  testClassesDirs = sourceSets.functionalTest.output.classesDirs
  classpath = sourceSets.functionalTest.runtimeClasspath
}

tasks.register('integration', Test) {
  description = "Runs integration tests"
  group = "Verification"
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
  failFast = true
}

tasks.register('smoke', Test) {
  description = "Runs Smoke Tests"
  group = "Verification"
  testClassesDirs = sourceSets.smokeTest.output.classesDirs
  classpath = sourceSets.smokeTest.runtimeClasspath
}

jacocoTestReport {
  executionData(test, integration)
  reports {
    xml.getRequired().set(true)
    csv.getRequired().set(false)
    html.getRequired().set(true)
  }
}

tasks.sonarqube.dependsOn(jacocoTestReport)
tasks.check.dependsOn(integration)

sonarqube {
  properties {
    property "sonar.projectName", "HMCTS :: Try It Now :: Court Schedule"
    property "sonar.projectKey", "uk.gov.hmcts.cp:try-cp-crime-schedulingandlisting-courtschedule"
    property "sonar.coverage.exclusions", "**/Application.java,**/exceptions/**"
  }
}

// NOTE: the com.github.ben-manes.versions plugin and its dependencyUpdates block were removed.
//
// Its implementation artefact, io.github.ben-manes:gradle-versions-plugin, is NOT published to Maven
// Central - only to the Gradle Plugin Portal, which redirects artefact downloads to a separate host,
// plugins-artifacts.gradle.org. That makes it fragile on a CNP Jenkins agent, which failed with
// "Could not resolve io.github.ben-manes:gradle-versions-plugin:0.61.0".
//
// Nothing needed it. No Jenkinsfile runs dependencyUpdates, and Renovate - now mandatory in every
// repo extending the org config - reports outdated dependencies continuously, as PRs, rather than as
// a report somebody has to remember to run. Do not re-add it; configure Renovate instead.

// The auth sources and the two filters below are lifted from
// service-cp-crime-scheduleandlist-courtschedule so this sandbox enforces exactly the token rules the
// live API enforces. Five of them (EntraTokenValidator, EntraAuthProperties, AuthMode,
// ValidatedCaller, TokenValidationException) are byte-identical to their source and must stay that
// way; the rest diverge only as documented in-file. Keeping them diffable matters more than
// reformatting them to this repo's checkstyle profile, so they are excluded rather than edited.
// Everything written for this service is checked normally.
checkstyleMain {
  exclude 'uk/gov/hmcts/cp/auth/**'
  exclude 'uk/gov/hmcts/cp/filters/ClientIdResolutionFilter.java'
  exclude 'uk/gov/hmcts/cp/filters/tracing/TracingFilter.java'
}

// https://jeremylong.github.io/DependencyCheck/dependency-check-gradle/configuration.html
dependencyCheck {
  suppressionFile = 'config/owasp/suppressions.xml'
}

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    url = uri('https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1')
  }
}

ext['snakeyaml.version'] = '2.0'
// 28/06/2026 temp fix for tomcat CVE-2026-65182 pending spring boot catchup
ext['tomcat.version'] = '11.0.25'

dependencies {
  // The API contract this sandbox implements. The generated CourtScheduleApi interface and its
  // models are the ONLY definition of the response shape - every stub in src/main/resources/stubs
  // is deserialised into these types by ScenarioCatalogContractTest, so a stub that drifts from the
  // published contract fails the build rather than silently serving a wrong body.
  //
  // The exclusions below are not optional. The published runtimeElements variant of api-cp-* declares
  // openapi-generator-core, swagger-parser and swagger-annotations as runtime dependencies. The
  // OpenAPI generator is a BUILD-time tool and has no business on a consumer's runtime classpath.
  // Its apiElements variant declares none of them, which is why compileJava is unaffected and bootJar
  // - the first task to resolve runtimeClasspath - is where it surfaces. Two of those coordinates are
  // not resolvable on the CNP Jenkins agent, so the build is green locally and red in the pipeline.
  // They also drag in swagger-parser v2 and v3 and swagger-core 1.6.x for no runtime purpose.
  // The real fix belongs upstream in api-cp-*; until it lands, exclude them here. Do not re-add.
  implementation("uk.gov.hmcts.cp:api-cp-crime-schedulingandlisting-courtschedule:1.1.0") {
    exclude group: 'org.openapitools',     module: 'openapi-generator-core'
    exclude group: 'io.swagger.parser.v3', module: 'swagger-parser'
    exclude group: 'io.swagger.core.v3',   module: 'swagger-annotations'
  }

  // Resolves the @Schema/@Parameter annotations on the generated api-cp-* interface/models - without
  // it -Werror fails on "unknown enum constant" for their RequiredMode/ParameterIn values. Same
  // io.swagger.v3.oas.annotations package as the non-jakarta swagger-annotations excluded above, and
  // it already resolves on the Jenkins agent. Declared implementation rather than compileOnly so the
  // annotations stay on the runtime classpath for anything that reflects over the generated types.
  implementation "io.swagger.core.v3:swagger-annotations-jakarta:2.2.55"

  // Mints the demo access tokens AND verifies them. Same library the real service uses, so the
  // copied EntraTokenValidator is byte-identical to service-cp-crime-scheduleandlist-courtschedule.
  implementation "com.nimbusds:nimbus-jose-jwt:10.9.1"

  // Recording store. The sandbox holds recorded examples rather than only committed fixtures -
  // see the Recording pipeline section of the README.
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-flyway'
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-database-postgresql'
  implementation 'org.postgresql:postgresql'

  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-actuator'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-aspectj'
  implementation 'org.springframework.boot:spring-boot-starter-validation'

  implementation 'com.fasterxml.jackson.core:jackson-databind'
  implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
  implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

  // micrometer-registry-prometheus: management.endpoints exposure includes "prometheus", which
  // 404s without a registry implementation on the classpath.
  implementation 'io.micrometer:micrometer-registry-prometheus'

  // Encodes caller-supplied values before they reach log lines, preventing log injection
  implementation 'org.owasp.encoder:encoder:1.4.0'

  implementation group: 'com.github.hmcts.java-logging', name: 'logging', version: '8.0.0'

  implementation 'org.apache.logging.log4j:log4j-to-slf4j'
  implementation 'ch.qos.logback:logback-classic'
  implementation 'ch.qos.logback:logback-core'

  compileOnly 'org.projectlombok:lombok:1.18.48'
  annotationProcessor 'org.projectlombok:lombok:1.18.48'
  testCompileOnly 'org.projectlombok:lombok:1.18.48'
  testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.testcontainers:postgresql:1.21.4'
  testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test'
  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-webmvc-test'
  testImplementation group: 'io.rest-assured', name: 'rest-assured', version: '6.0.1'
}

// Generates META-INF/build-info.properties, which is the only reason GET /info returns anything
// other than {}. Copied from the spring-actuator.gradle that
// service-cp-crime-hearing-results-document-subscription applies, so /info carries the same fields
// here as it does there.
//
// Setting duplicatesStrategy hides the failure but the generated file wins, discarding the
// pipeline's commit and build number. So the right answer is to let the platform supply it.
//
// Consequence: a locally built jar has no build-info, so GET /info returns {}. Only a
// pipeline-built artefact has one. src/test/resources/META-INF/build-info.properties exists so the
// endpoint is still covered by a test.

bootJar {
  archiveFileName = "apim-try-slc.jar"

  manifest {
    attributes('Implementation-Version': project.version.toString())
  }
}

// The try-it-now contracts. Two specs, shared by every try-it-now service: the public one a
// consumer sees alongside the api-cp-* contract, and the internal admin one that is not published
// to APIM. Both generate interfaces this service implements, the same way it implements
// CourtScheduleApi from the api-cp jar.
//
// THE PACKAGE MUST NOT BE uk.gov.hmcts.cp.openapi. Every api-cp-* artefact generates into
// uk.gov.hmcts.cp.openapi.{api,model}, and the SLC contract jar is already on this classpath - a
// second generator writing into the same package would collide with it. tryitnow.openapi keeps
// them apart.
// The two specs also generate into packages distinct from EACH OTHER. The generator emits a
// helper class (ApiUtil) into whichever api package it is given, so pointing both at one package
// produces a duplicate class and the build fails - and it fails confusingly, because javac aborts
// annotation processing on a duplicate and Lombok's generated members then look missing everywhere
// else. The split also says which surface is which.

def contractSpecs = [
  tryItNowPublic: ['try-it-now-public.openapi.yml', 'uk.gov.hmcts.cp.tryitnow.openapi'],
  tryItNowAdmin : ['try-it-now-admin.openapi.yml', 'uk.gov.hmcts.cp.tryitnow.admin.openapi'],
]

contractSpecs.each { taskSuffix, spec ->
  def (specFile, basePackage) = spec
  tasks.register("generate${taskSuffix.capitalize()}Api", org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = 'spring'
    inputSpec = "$projectDir/contracts/$specFile"
    outputDir = "$buildDir/generated/$taskSuffix"
    apiPackage = "${basePackage}.api"
    modelPackage = "${basePackage}.model"
    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = false
    generateModelDocumentation = false
    configOptions = [
      interfaceOnly   : 'true',
      useSpringBoot3  : 'true',
      useJakartaEe    : 'true',
      openApiNullable : 'false',
      skipDefaultInterface: 'true',
      documentationProvider: 'none',
    ]
  }
  sourceSets.main.java.srcDir "$buildDir/generated/$taskSuffix/src/main/java"
  tasks.named('compileJava') { dependsOn "generate${taskSuffix.capitalize()}Api" }
}

// Generated sources are not ours to style-check.
tasks.named('checkstyleMain') {
  exclude '**/tryitnow/**'
  exclude '**/org/openapitools/**'
}


// Gradle 7.x issue, workaround from: https://github.com/gradle/gradle/issues/17236#issuecomment-894768083
rootProject.tasks.named("processSmokeTestResources") {
  duplicatesStrategy = 'include'
}

wrapper {
    distributionType = Wrapper.DistributionType.ALL
}
