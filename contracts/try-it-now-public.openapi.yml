openapi: 3.0.3

info:
  title: Try It Now — public API
  description: >-
    The parts of a try-it-now sandbox that a prospective API consumer calls, and the only parts
    exposed through Azure APIM.


    This contract is **shared by every try-it-now service**. It carries no domain endpoints: the
    API being demonstrated comes from that service's own `api-cp-*` contract, and the two are
    published together. A consumer therefore sees one catalogue entry made of two specs — the
    sandbox plumbing described here, and the real API shape described there.


    Everything here is **unauthenticated**. `GET /scenarios` has to be readable before a consumer
    holds a token, since it is where the token realm, audience and issuer come from.


    Two realms. `authentication.mode` says which one a deployment runs: `self-issued`, where this
    service mints the tokens and the endpoints below exist, or `entra`, where it verifies real
    Microsoft tokens and they do not.
  version: 1.0.0
  contact:
    email: no-reply@hmcts.net
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /
    description: The sandbox itself

tags:
  - name: discovery
    description: What this sandbox offers, and how to call it
  - name: token
    description: Demo credentials, issued and verified by the sandbox alone

paths:
  /scenarios:
    get:
      summary: What this sandbox serves, and how to call it
      description: >-
        Self-documenting. Lists the case URNs that produce each outcome, the source environment
        each example was captured from, and which token realm this deployment runs.


        It does **not** return credentials. This response is read by consumers evaluating the live
        API, most of whom hold an Entra token from their own registration, and a client id and
        secret here would invite them to use the wrong one. The demo credentials for a
        `self-issued` deployment are published in the service README.


        Unauthenticated by design — a consumer needs this before it can obtain a token.
      operationId: getScenarios
      tags: [discovery]
      responses:
        '200':
          description: The sandbox catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenariosResponse'

  /oauth2/v2.0/token:
    post:
      summary: Issue a demo access token
      description: >-
        Mirrors the Microsoft Entra `client_credentials` token endpoint closely enough that a
        consumer can point an existing Entra client at it.


        **The token is worthless anywhere else.** The sandbox signs it with its own key and the
        `iss`, `aud` and `tid` claims are its own identifiers, so it authenticates nothing against
        a real HMCTS API.


        **Present in the `self-issued` realm only.** Where `authentication.mode` is `entra` this
        endpoint does not exist and answers 404 — the service cannot issue a token it would then
        have to reject. Check `GET /scenarios` first.
      operationId: issueDemoToken
      tags: [token]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: A demo access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: The request was not a well-formed client-credentials grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenError'
        '401':
          description: Unknown client, or the secret did not match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenError'

  /.well-known/jwks.json:
    get:
      summary: The sandbox's public signing key
      description: >-
        The public half of the key the sandbox signs demo tokens with. Published so a consumer can
        verify a token the same way it would verify an Entra one. The private half never leaves the
        service.


        **Present in the `self-issued` realm only**, and answers 404 otherwise — see the token
        endpoint above.
      operationId: getJwks
      tags: [token]
      responses:
        '200':
          description: A JWK Set containing one RSA public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwkSet'

components:
  schemas:

    ScenariosResponse:
      type: object
      description: Everything a consumer needs to make a first successful call.
      required: [description, authentication, howToCall, scenarios]
      properties:
        description:
          type: string
          description: What this sandbox is, and what it is not.
        authentication:
          $ref: '#/components/schemas/Authentication'
        howToCall:
          $ref: '#/components/schemas/HowToCall'
        scenarios:
          type: array
          description: One entry per case URN this sandbox will answer for.
          items:
            $ref: '#/components/schemas/ScenarioSummary'

    HowToCall:
      type: object
      description: The two calls, in order.
      properties:
        1_getToken:
          type: string
          description: How to obtain a demo access token.
        2_callApi:
          type: string
          description: How to call the demonstrated API with it.
        note:
          type: string
          description: Why the token is not an Entra token.

    Authentication:
      type: object
      description: >-
        Which token realm this deployment runs, and where to get a token for it. Read this before
        anything else: it is the only way to tell whether to ask this service for a token or ask
        Microsoft Entra, and the two are mutually exclusive.
      required: [mode, requiredRole, audience, issuer, tokenEndpoint]
      properties:
        mode:
          type: string
          enum: [self-issued, entra]
          description: >-
            `self-issued` — this service mints and verifies its own tokens, and the demo
            credentials in the service README work. `entra` — it verifies real Microsoft Entra
            app-only tokens, and you need your own app registration carrying the required role.
        requiredRole:
          type: string
          description: The application role a token must carry, or calls answer 403.
        audience:
          type: string
          description: The `aud` claim a token must carry.
        issuer:
          type: string
          description: The exact `iss` claim a token must carry. Matched exactly, not by prefix.
        tokenEndpoint:
          type: string
          description: >-
            Where to get a token. A path on this service in the `self-issued` realm, an absolute
            `login.microsoftonline.com` URL in the `entra` realm.
        jwksEndpoint:
          type: string
          description: >-
            Where this service publishes its verification key. Present in the `self-issued` realm
            only — in `entra` the keys that matter are the tenant's.
        scope:
          type: string
          description: >-
            The `scope` to request, in `<audience>/.default` form. Present in the `entra` realm
            only; `client_credentials` cannot request an individual scope.

    ScenarioSummary:
      type: object
      description: One published example.
      required: [id, caseUrn, status, summary, recordedFrom, path]
      properties:
        id:
          type: string
          description: Short identifier, for example `allocated`.
        caseUrn:
          type: string
          description: The URN to call this sandbox with.
        status:
          type: integer
          format: int32
          description: The HTTP status this scenario answers with.
        summary:
          type: string
          description: One line describing what it demonstrates.
        recordedFrom:
          type: string
          description: >-
            Where the example came from — `fixture` for a committed stub, otherwise the source
            environment. Surfaced so nobody mistakes a lower-environment capture for live data.
        path:
          type: string
          description: The fully resolved path to call.

    TokenRequest:
      type: object
      description: A client-credentials grant, in the form Entra expects.
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
          description: Only `client_credentials` is supported.
        client_id:
          type: string
          format: uuid
        client_secret:
          type: string
        scope:
          type: string
          description: Accepted and ignored. Present so an Entra-shaped client needs no change.

    TokenResponse:
      type: object
      description: An Entra-shaped token response.
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: A signed JWT, verifiable against the published JWKS.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int32
          description: Lifetime in seconds.

    TokenError:
      type: object
      description: An OAuth 2.0 error, in the form RFC 6749 defines.
      required: [error]
      properties:
        error:
          type: string
          description: For example `invalid_client` or `unsupported_grant_type`.
        error_description:
          type: string

    JwkSet:
      type: object
      description: A JSON Web Key Set.
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'

    Jwk:
      type: object
      description: One RSA public key.
      required: [kty, kid, n, e]
      properties:
        kty:
          type: string
          enum: [RSA]
        use:
          type: string
          enum: [sig]
        alg:
          type: string
          enum: [RS256]
        kid:
          type: string
        n:
          type: string
          description: Modulus, base64url.
        e:
          type: string
          description: Exponent, base64url.
