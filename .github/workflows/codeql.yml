# Ported from service-cp-crime-hearing-results-document-subscription, which is where the
# required-check names come from. Two jobs from that file are deliberately absent:
#
#   - DAST. It drives apiTest/docker-compose.yml, which this repo does not have.
#   - cyclonedxBom and the SBOM upload. This repo does not apply the CycloneDX plugin, so
#     the task does not exist and the build step would fail.
#
# Adding either means adding the thing it depends on first.
name: CodeQL

on:
  pull_request:
    branches:
      - master
      - main

  schedule:
    - cron: '36 5 * * 4'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: current

      - name: Gradle Build
        run: ./gradlew build -x test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:${{matrix.language}}"
